# AI Trading Bot Configuration
# Self-Learning Trading System

# General Settings
general:
  name: "AI-TradingBot"
  version: "1.0.0"
  mode: "paper"  # paper, live
  log_level: "INFO"
  timezone: "UTC"

# Trading Settings
trading:
  platform: "mt5"  # mt5, exchange
  symbols:
    - "EURUSD"
    - "GBPUSD"
    - "USDJPY"
    - "XAUUSD"
    - "BTCUSD"
  timeframes:
    - "1m"
    - "5m"
    - "15m"
    - "1h"
    - "4h"
    - "1d"
  default_timeframe: "1h"
  max_open_positions: 3  # REDUCED: Max 3 positions (was 5)
  use_leverage: true
  max_leverage: 50  # REDUCED: Max 50x leverage (was 100x) - safer
  default_lot_size: 0.01

  # === CRITICAL FIX: Trading controls ===
  min_confidence: 0.55  # Minimum 55% confidence to trade
  min_trade_interval_seconds: 1800  # 30 minutes between trades per symbol
  max_trades_per_day: 5  # Maximum 5 trades per day per symbol
  session_filter_enabled: true  # Enable session filtering for symbols

  # Symbol-specific settings
  symbol_settings:
    XAUUSD:  # Gold-specific settings
      min_sl_atr_mult: 2.5  # Minimum 2.5x ATR for stop loss
      min_tp_atr_mult: 3.5  # Minimum 3.5x ATR for take profit
      session_filter: true  # Only trade London/NY sessions
      avoid_asian_session: true  # Skip Asian session (low liquidity)

# Risk Management
# CRITICAL FIX: Reduced risk after losing streak
# Conservative approach: Lower risk per trade + tighter drawdown limits
risk:
  max_risk_per_trade: 0.005  # 0.5% of portfolio (REDUCED from 1%)
  max_daily_drawdown: 0.02  # 2% daily max (REDUCED from 3%)
  max_total_drawdown: 0.08  # 8% total max (REDUCED from 10%)
  risk_reward_ratio: 1.4  # Target 1.4:1 R:R (3.5/2.5 ATR ratio)
  trailing_stop: true
  trailing_stop_pct: 0.015  # 1.5% trailing stop
  use_dynamic_position_sizing: true

  # Stop loss and take profit settings
  stop_loss_atr_multiplier: 2.5  # INCREASED: 2.5x ATR (was 2.0x)
  take_profit_atr_multiplier: 3.5  # INCREASED: 3.5x ATR (was 3.0x)

  # Emergency exit
  emergency_exit_threshold: -0.05  # Exit if single trade loses 5% of account

# Neural Network Settings
neural_networks:
  lstm:
    sequence_length: 60
    hidden_size: 128
    num_layers: 3
    dropout: 0.2
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
  gru:
    sequence_length: 60
    hidden_size: 128
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.001
  cnn:
    image_size: [64, 64]
    channels: 1
    kernel_size: 3
    num_filters: [32, 64, 128]
    dropout: 0.3

# Reinforcement Learning Settings
reinforcement_learning:
  ppo:
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    total_timesteps: 1000000
  dql:
    learning_rate: 0.0001
    buffer_size: 100000
    batch_size: 64
    gamma: 0.99
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.995
    target_update_freq: 1000

# NLP Settings
nlp:
  model_name: "ProsusAI/finbert"
  max_length: 512
  sentiment_threshold: 0.3
  news_sources:
    - "https://feeds.finance.yahoo.com/rss/2.0/headline"
    - "https://www.investing.com/rss/news.rss"
  update_interval: 300  # seconds
  languages: ["en"]

# Genetic Algorithm Settings
genetic_algorithm:
  population_size: 100
  generations: 50
  mutation_rate: 0.1
  crossover_rate: 0.8
  tournament_size: 5
  elite_size: 10
  parameter_ranges:
    take_profit: [0.01, 0.10]
    stop_loss: [0.01, 0.05]
    rsi_period: [7, 21]
    ma_fast: [5, 20]
    ma_slow: [20, 100]

# Explainable AI Settings
xai:
  method: "shap"  # shap, lime, attention
  num_samples: 100
  feature_importance_threshold: 0.05
  generate_reports: true
  report_interval: 86400  # daily

# Self-Learning Settings
self_learning:
  enabled: true
  learning_interval: 3600  # seconds
  min_trades_for_update: 10
  performance_window: 100  # trades
  strategy_update_threshold: 0.1  # 10% performance change
  save_checkpoints: true
  checkpoint_interval: 86400  # daily

# Ensemble Strategy Settings (V2.0 Hybrid System)
ensemble:
  # Hybrid weights (ML + TA fusion)
  ml_weight: 0.60  # 60% weight to ML predictions
  ta_weight: 0.40  # 40% weight to technical analysis

  # Model health requirements
  min_directional_accuracy: 0.50  # Minimum 50% directional accuracy
  min_correlation: 0.02  # Minimum 0.02 correlation to be healthy

  # Legacy settings (for backwards compatibility)
  min_confidence_for_trade: 0.55  # Minimum ensemble confidence
  fallback_to_momentum: false  # DISABLED: No momentum fallback
  min_models_agreement: 2  # At least 2 models must agree
  weight_by_performance: true  # Use performance-weighted ensemble

# Trade Guard Settings (V2.0 Anti-Flip-Flop System)
trade_guard:
  cooldown_minutes: 30  # 30 minutes between trades
  max_daily_trades: 3  # Maximum 3 trades per day
  max_consecutive_losses: 3  # Stop after 3 consecutive losses
  require_trend_alignment: true  # Only trade with the trend
  signal_consistency_required: 3  # Require 3/5 signals in same direction
  signal_history_size: 5  # Track last 5 signals

# Advanced Risk Calculator (V2.0 Swing-Based SL)
advanced_risk:
  # Risk-Reward enforcement
  min_rr_ratio: 3.0  # MANDATORY 1:3 Risk-Reward minimum
  risk_per_trade: 0.01  # 1% risk per trade

  # Swing-based stop loss
  sl_method: "swing"  # Use swing points for SL
  sl_swing_lookback: 10  # Look back 10 bars for swing points
  min_sl_atr: 1.5  # Minimum 1.5x ATR for SL
  max_sl_atr: 3.0  # Maximum 3.0x ATR for SL

  # Position sizing
  max_position_size: 1.0  # Maximum 1.0 lot per trade
  min_position_size: 0.01  # Minimum 0.01 lot

# Data Settings
data:
  lookback_days: 365
  train_split: 0.7
  validation_split: 0.15
  test_split: 0.15
  feature_scaling: "minmax"  # minmax, standard, robust
  cache_data: true
  cache_expiry: 3600  # seconds

# API Settings
api:
  host: "0.0.0.0"
  port: 8000
  enable_websocket: true
  cors_origins: ["*"]

# MetaTrader 5 Settings
mt5:
  # Path to MT5 terminal (optional, auto-detect if not set)
  path: null  # e.g., "C:/Program Files/MetaTrader 5/terminal64.exe"
  # Login credentials (can also use environment variables)
  login: null  # MT5 account number
  password: null  # MT5 password
  server: null  # Broker server name
  # Trading settings
  magic_number: 123456  # EA identification number
  deviation: 20  # Max price deviation in points
  fill_policy: "ioc"  # fok, ioc, return
  # Connection settings
  timeout: 60000  # Connection timeout ms
  portable: false  # Use portable mode
  # Auto-reconnect
  auto_reconnect: true
  reconnect_delay: 5  # seconds
  max_reconnect_attempts: 3

# Exchange Settings (for crypto, optional)
exchange:
  name: "binance"
  testnet: true
  rate_limit: true
  timeout: 30000

# Database Settings
database:
  type: "sqlite"  # sqlite, postgresql, mongodb
  path: "data_cache/trading.db"

# Logging Settings
logging:
  file: "logs/trading_bot.log"
  max_size: "100MB"
  backup_count: 5
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {module}:{function}:{line} | {message}"
